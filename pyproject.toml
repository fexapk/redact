[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redact"
version = "0.1.0"
description = "Local rasterizing PDF redaction app."
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.26.0",
    "Pillow>=11.0.0",
    "PySide6>=6.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
redact = "redact_app.app:main"

[tool.setuptools.packages.find]
where = ["src"]

